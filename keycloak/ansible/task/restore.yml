---
- name: Restore keycloak postgres database
  become: true
  block:
    

    #------------------------
    # Check backup directory
    #------------------------
    - name: Ensure backup directory exists
      file:
        path: "{{ backup_dir }}"
        state: directory
        mode: '0755'

    #------------------------------
    # Keycloak docker compose down
    #------------------------------
    - name: Stop docker compose stack
      command: docker compose down
      args:
        chdir: "{{ project_path }}"


    #-----------------------------------
    # Backup keycloak posrgres database
    #-----------------------------------
    - name: Run postgres dump container
      shell: |
        docker run --rm \
        --network {{ network_name }} \
        -e PGPASSWORD={{ db_password }} \
        -v {{ backup_dir }}:/backup \
        postgres:16 \
        pg_dump -h keycloak_db -U {{ db_user }} {{ db_name }} \
        > {{ backup_dir }}/keycloak_backup_$(date +%Y%m%d_%H%M%S).sql
        
      args:
        executable: /bin/bash


    #----------------------------
    # Keycloak docker compose up
    #----------------------------
    - name: Start docker compose stack
      command: docker compose up -d
      args:
        chdir: "{{ project_path }}"

--------------------------





tasks:


    #----------------------------
    # Keycloak docker compose up
    #----------------------------
    - name: Start docker compose once to create database
      command: docker compose up -d
      args:
        chdir: "{{ project_path }}"


    #------------------------------
    # Keycloak docker compose down
    #------------------------------
    - name: Stop docker compose stack
      command: docker compose down
      args:
        chdir: "{{ project_path }}"


    #-----------------------------------
    # Backup keycloak posrgres database
    #-----------------------------------
    - name: Restore Keycloak database from backup
      shell: |
        docker exec -i keycloak_db \
        psql -U {{ db_user }} -d {{ db_name }} \
        < {{ backup_dir }}/{{ backup_file_name }}
      args:
        executable: /bin/bash


    #----------------------------
    # Keycloak docker compose up
    #----------------------------
    - name: Start docker compose stack
      command: docker compose up -d
      args:
        chdir: "{{ project_path }}"
