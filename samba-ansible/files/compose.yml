version: '3.8'

services:
  samba-ad-dc:
    build: .
    container_name: samba-ad-dc
    hostname: fpe-samba
    restart: unless-stopped
    network_mode: host
    privileged: true

    environment:
      SAMBA_REALM: FPE.LOCAL
      SAMBA_DOMAIN: FPE
      SAMBA_ADMIN_PASSWORD: "Admin@12345"
      SAMBA_DNS_FORWARDER: 8.8.8.8

    volumes:
      - /root/samba-dc/data/lib:/var/lib/samba
      - /root/samba-dc/data/etc:/etc/samba
      - /root/samba-dc/data/run:/var/run/samba
