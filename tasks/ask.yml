# -------------------------------------------------
# Ask group action
# -------------------------------------------------
- name: Ask Preparing Action
  pause:
    prompt: |
      ===================================
      Select Type of Node:

      1. Bastion Node
      2. Master Node
      3. Worker Node
      4. Exit

      Choose action (1-4):
  register: type_node

- name: Set action fact
  set_fact:
    group_action: "{{ type_node.user_input | trim }}"

# -----------------------------
# Starting Preparing Based On Node
# -----------------------------
- name: Preparing Bastion Node
  ansible.builtin.include_tasks: bastion-node.yml
  when: type_node.user_input | trim == '1'

- name: Preparing Master Node
  ansible.builtin.include_tasks: master-node.yml
  when: type_node.user_input | trim == '2'

- name: Preparing Worker Node
  ansible.builtin.include_tasks: worker-node.yml
  when: type_node.user_input | trim == '3'

- name: Exit
  debug:
    msg: "Goodbye!"
  when: type_node.user_input | trim == '4'

- meta: end_play
  when: type_node.user_input | trim == ''

  vars:
    operation_map:
      '1': 'bastion'
      '2': 'master'
      '3': 'worker'
      '4': 'exit'