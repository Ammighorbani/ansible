---
- name: Setup LVM for audit logs
  hosts: localhost
  connection: local
  become: yes

  vars:
    vg_name: "debian-vg"
    lv_name: "var-audit"
    lv_size: "5G"
    mount_point: "/var/log/audit"
    fs_type: "ext4"

  tasks:
    - name: 1. Install lvm2 package
      apt:
        name: lvm2
        state: present

    - name: 2. Check if Volume Group exists
      command: "vgs {{ vg_name }}"
      register: vg_check
      failed_when: false
      changed_when: false

    - name: 3. Stop if VG is missing
      fail:
        msg: "Error: Volume Group '{{ vg_name }}' not found! Please create it first using 'vgcreate'."
      when: vg_check.rc != 0

    - name: 4. Create Logical Volume
      command: "lvcreate -L {{ lv_size }} -n {{ lv_name }} {{ vg_name }}"
      args:
        creates: "/dev/{{ vg_name }}/{{ lv_name }}"

    - name: 5. Check if filesystem already exists
      command: "blkid /dev/{{ vg_name }}/{{ lv_name }}"
      register: blkid_check
      failed_when: false
      changed_when: false

    - name: 6. Create ext4 filesystem
      command: "mkfs.{{ fs_type }} /dev/{{ vg_name }}/{{ lv_name }}"
      when: blkid_check.rc != 0

    - name: 7. Ensure mount point directory exists
      file:
        path: "{{ mount_point }}"
        state: directory
        mode: '0755'

    - name: 8. Add to /etc/fstab for persistence
      lineinfile:
        path: /etc/fstab
        line: "/dev/mapper/{{ vg_name | replace('-', '--') }}-{{ lv_name | replace('-', '--') }}  {{ mount_point }}  {{ fs_type }}  defaults  0  2"
        state: present

    - name: 9. Mount the volume
      command: "mount -a"
      register: mount_result
      changed_when: "'already mounted' not in mount_result.stderr"
