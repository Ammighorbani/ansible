---
- name: Create LV for /var/log/audit without community.general
  hosts: localhost
  connection: local
  become: yes

  vars:
    vg_name: debian-vg
    lv_name: var-audit
    lv_size: 5G
    mount_point: /var/log/audit
    fs_type: ext4

  tasks:
    - name: Ensure required packages are installed
      apt:
        name:
          - lvm2
          - util-linux
          - e2fsprogs
        state: present
        update_cache: yes

    - name: Check VG exists
      command: "vgs {{ vg_name }}"
      register: vg_check
      changed_when: false

    - name: Fail if VG does not exist
      fail:
        msg: "VG '{{ vg_name }}' not found. Create PV/VG first (pvcreate/vgcreate) or attach a new disk."
      when: vg_check.rc != 0

    - name: Create logical volume if missing
      command: "lvcreate -L {{ lv_size }} -n {{ lv_name }} {{ vg_name }}"
      args:
        creates: "/dev/{{ vg_name }}/{{ lv_name }}"

    - name: Check if filesystem already exists
      command: "blkid -o value -s TYPE /dev/{{ vg_name }}/{{ lv_name }}"
      register: fs_check
      changed_when: false
      failed_when: false

    - name: Create filesystem if missing
      command: "mkfs.{{ fs_type }} -F /dev/{{ vg_name }}/{{ lv_name }}"
      when: fs_check.stdout | trim == ""

    - name: Ensure mount directory exists
      file:
        path: "{{ mount_point }}"
        state: directory
        mode: "0755"

    - name: Ensure fstab entry exists
      lineinfile:
        path: /etc/fstab
        line: "/dev/{{ vg_name }}/{{ lv_name }}  {{ mount_point }}  {{ fs_type }}  defaults  0  2"
        state: present

    - name: Mount filesystem
      mount:
        path: "{{ mount_point }}"
        src: "/dev/{{ vg_name }}/{{ lv_name }}"
        fstype: "{{ fs_type }}"
        state: mounted
